[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voders-acestep-backend"
version = "0.1.0"
description = "Out-of-process ACE-Step accompaniment backend for voders"
# ACE-Step (real package `ace_step` v0.2.0, Apache-2.0) is a git repo that pins a stack
# (soundfile==0.13.1, transformers==4.50, spacy==3.8.4, pytorch_lightning, cutlet→mojimoji) which
# conflicts with the 3.14 core and lacks Python 3.14 / linux-aarch64 wheels. So it lives in its own
# uv project (Python 3.12) and the core invokes its worker with `uv run --project backends/acestep`.
requires-python = ">=3.12,<3.13"
dependencies = [
    "ace-step",
    # Torch stack (cu130 wheels resolve for linux-aarch64 + Blackwell sm_121).
    "torch>=2.12",
    "torchaudio>=2.11",
    "torchvision>=0.27",        # acestep.music_dcae imports torchvision.transforms at load
    # Model + inference stack.
    "diffusers>=0.33.0",
    "transformers>=4.50",
    "huggingface_hub",
    "accelerate>=1.6",
    "safetensors",
    "einops",
    "omegaconf",
    "pytorch_lightning>=2.5",
    # Audio I/O (the worker routes torchaudio.load/save through soundfile to avoid torchcodec/FFmpeg).
    "soundfile>=0.14",
    "librosa>=0.11",
    "numba>=0.61",              # modern numba/llvmlite ship aarch64 + py3.12 wheels
    "llvmlite>=0.44",
    # Lyric/text tokenizer deps imported at pipeline load (Japanese cutlet/fugashi excluded below).
    "spacy>=3.8",
    "hangul-romanize",
    "num2words",
    "pypinyin",
    "py3langid",
    "loguru",
    "tqdm",
]

[tool.uv.sources]
ace-step = { git = "https://github.com/ace-step/ACE-Step.git" }

[tool.uv]
# Override ACE-Step's pins that are unbuildable/unavailable on linux-aarch64. A `; sys_platform ==
# 'never'` marker is uv's idiom for dropping a transitive dependency entirely.
override-dependencies = [
    "soundfile>=0.14",                       # ACE-Step pins ==0.13.1
    "spacy>=3.8",                            # ACE-Step pins ==3.8.4 (no aarch64 wheel)
    "numba>=0.61",                           # avoid the ancient numba/llvmlite ACE-Step would pull
    "cutlet; sys_platform == 'never'",       # Japanese romanizer → mojimoji C-ext (no aarch64 wheel)
    "mojimoji; sys_platform == 'never'",     # needs Python.h to build; only for Japanese lyrics
    "fugashi; sys_platform == 'never'",      # MeCab binding; Japanese only, not needed for instrumental
    "gradio; sys_platform == 'never'",       # web UI; not needed for headless inference
    "tensorboard; sys_platform == 'never'",  # training only
    "tensorboardX; sys_platform == 'never'", # training only
]

[tool.setuptools.packages.find]
where = ["src"]
