[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voders-rvc-backend"
version = "0.1.0"
description = "Out-of-process RVC voice-conversion backend for voders (separate dependency chain)"
# rvc-python pins numpy/deps with no Python 3.14 wheels, so this backend pins 3.11 and the 3.14
# core talks to it across a process boundary (src/voders/render/backend_bridge.py).
requires-python = ">=3.11,<3.12"
dependencies = [
    "rvc-python>=0.0.6",
    "soundfile>=0.12",
    "numpy<2",
]

[project.scripts]
voders-rvc-backend = "voders_rvc_backend.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
