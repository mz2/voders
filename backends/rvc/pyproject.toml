[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voders-rvc-backend"
version = "0.1.0"
description = "Out-of-process RVC voice-conversion backend for voders (separate dependency chain)"
# rvc-python depends on fairseq, whose mutable dataclass defaults are rejected by Python 3.11+
# (ValueError: mutable default ... use default_factory). fairseq is unmaintained, so this backend
# pins Python 3.10, where it imports. The 3.14 core talks to it across a process boundary
# (src/voders/render/backend_bridge.py) — which is exactly why the backend is its own uv project.
requires-python = ">=3.10,<3.11"
dependencies = [
    "rvc-python>=0.0.6",
    "soundfile>=0.12",
    "numpy<2",
]

[project.scripts]
voders-rvc-backend = "voders_rvc_backend.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
