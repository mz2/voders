# Deterministic lane driven by a REAL donor voice (VocalSet, CC BY 4.0) instead of the synthetic
# fixture vowel. Fetch it first: `just download-donors`.
run_id: real_donor
master_seed: 20260627

scores: evals/fixtures/scores/score_00[0-1].tsv
output_root: out/real_donor

voices:
  - voice_id: vocalset_donor
    kind: deterministic_donor
    license: "VocalSet, CC BY 4.0 (Wilkins et al.); streamed sample"
    consent_verified: true
    model_ref: models/donors/vocalset_singer.wav

lanes:
  deterministic:
    enabled: true
    synth: world

validator:
  onset_ms: 50
  min_note_ms: null
  min_note_percentile: 1
  f0_cents: 25
  f0_coverage: 0.80
  snr_floor_db: 0
