# Lyric smoke run — automatic syllable source on the CPU deterministic lane, laptop-runnable.
# The lyric layer resolves a per-note syllable plan and records lyric provenance; the deterministic
# lane does not articulate phonemes (only the SVS lane does), so this exercises the wiring,
# provenance, and reproducibility on CPU without a GPU/voicebank.
run_id: lyrics-smoke
master_seed: 20260627

scores: evals/fixtures/scores/*.tsv
output_root: out/lyrics-smoke

voices:
  - voice_id: donor_ah_synth
    kind: deterministic_donor
    license: "CC0 synthetic vowel"
    consent_verified: true
    model_ref: evals/fixtures/voices/donor_ah_synth.wav

lanes:
  deterministic:
    enabled: true
    synth: world

lyrics:
  source: automatic        # seeded CV-syllable sampler; needs no lyric input data
  inventory: en_cv

validator:
  onset_ms: 50
  offset_min_ms: 50
  offset_fraction: 0.20
  min_note_ms: null
  min_note_percentile: 1
  f0_cents: 25
  f0_coverage: 0.80
  snr_floor_db: 0
