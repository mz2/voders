# Lyric scat showcase — the SVS lane ARTICULATES the syllables (deterministic lane is vowel-only and
# not used for lyric work). Real espeak G2P -> SVS backend articulation at the score-derived pitch.
run_id: lyrics-scat
master_seed: 20260627

scores: evals/fixtures/scores/*.tsv
output_root: out/lyrics-scat

voices:
  - voice_id: svs_ah
    kind: svs_voicebank
    license: "CC0 synthetic vowel"
    consent_verified: true
    model_ref: r9y9/yoko_latest    # NNSVS voicebank: real neural singing

lanes:
  svs:
    enabled: true
    backend: nnsvs
    mode: force_score_f0

lyrics:
  source: automatic
  inventory: scat

validator:
  onset_ms: 50
  min_note_ms: null
  min_note_percentile: 1
  f0_cents: 25
  f0_coverage: 0.80
  snr_floor_db: 0
