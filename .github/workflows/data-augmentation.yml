name: data-augmentation

# Runs the whole data-augmentation pipeline on the donors checked into the repo (no network
# fetches): build the unified donor pool -> render the deterministic lane -> fan each accepted
# render through the augmentation profiles -> audit -> eval -> stats, then a stub training step.
# Triggered two ways:
#   * manually from the Actions tab (workflow_dispatch), and
#   * automatically when a GitHub Release is published (i.e. a release tag is created).
on:
  workflow_dispatch:
    inputs:
      run_training:
        description: "Run the (stub) training step after augmentation"
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  augment:
    name: Build augmented corpus
    # Runs on the repo's self-hosted runner.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # pull the committed Freesound donor WAVs (Git LFS)

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync CPU environment
        run: uv sync --extra cpu

      - name: Run data-augmentation pipeline (checked-in donors, no fetch)
        run: just augment FETCH=0

      - name: Upload augmented corpus
        uses: actions/upload-artifact@v4
        with:
          name: voders-corpus
          path: |
            out/donor_pool/**
          if-no-files-found: warn

  train:
    name: Train (stub)
    needs: augment
    # Always train on a release (tag); on a manual run only when the box is ticked.
    if: ${{ github.event_name == 'release' || inputs.run_training == true }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync CPU environment
        run: uv sync --extra cpu

      - name: Download augmented corpus
        uses: actions/download-artifact@v4
        with:
          name: voders-corpus
          path: out/donor_pool

      - name: Train on the augmented corpus
        run: just train
