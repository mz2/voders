name: train-on-augmented-corpus

# Trains (stub) on the augmented corpus that is committed under datasets/donor_pool/ as OGG.
# `just train` decompresses the archive to WAV and runs the trainer — no regeneration, no artifact
# passing. To rebuild the corpus from donors instead, run `just augment` locally and commit datasets/.
# Runs on the repo's self-hosted, NVIDIA-GPU-equipped runner (installs the gpu extra for training).
# Triggered manually (workflow_dispatch) or when a GitHub Release is published.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  train:
    name: Train (stub)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # pull the committed OGG corpus (Git LFS)

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Check GPU
        run: nvidia-smi

      - name: Train on the committed augmented corpus
        # GPU=1 syncs the gpu extra; `train` decompresses datasets/donor_pool -> out/ in-place.
        env:
          GPU: "1"
        run: just train
