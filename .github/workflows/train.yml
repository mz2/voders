name: train-soulx-baseline

# Runs the SoulX Basic Pitch baseline on the repo's self-hosted, NVIDIA-GPU-equipped runner.
# The runner must provide the Python training dependencies and the `syntheticdataset_soulx` and
# `klangiodataset` directories relative to the checked-out repository.
# Triggered manually, when a GitHub Release is published, or when the `train` label is applied to
# an issue.
on:
  workflow_dispatch:
  release:
    types: [published]
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  train:
    name: Train SoulX baseline
    if: github.event_name != 'issues' || github.event.label.name == 'train'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Check GPU
        run: nvidia-smi

      - name: Train
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          python3 -m training.train \
            --train-dataset Synthetic \
            --train-path syntheticdataset_soulx \
            --val-dataset Klangio \
            --sequence-length 8 \
            --batch-size 32 \
            --num-workers 8 \
            --prefetch-factor 4 \
            --frame-weight 9.0 \
            --onset-weight 18.0 \
            --learning-rate 1e-4 \
            --max-epochs 30 \
            --patience 30 \
            --eval-metric COnPOff_f1 \
            --precision bf16 \
            --torch-compile \
            --torch-compile-mode reduce-overhead \
            --media-log-interval-steps 50 \
            --output-dir BASIC_PITCH_CHALLENGE \
            --experiment-name soulx_baseline \
            --logger wandb \
            --wandb-entity krishnakalyan \
            --wandb-project MMLHackathon \
            --wandb-mode online \
            --wandb-name soulx-30epoch-compiled-bf16 \
            --wandb-tags baseline soulx huggingface bf16 media
